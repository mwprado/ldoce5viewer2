name: Verbum tests
on:
  push:
    branches: [dictviewer]
  pull_request:
    branches: [dictviewer]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml
      - run: python -m unittest discover -s tests -p "test_verbum*.py"
  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-lxml gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth
      - run: VERBUM_GTK_TEST=1 xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p test_verbum_gtk.py -v
